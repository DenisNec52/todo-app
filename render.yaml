# Render Blueprint: API Express (piano free).
# Dashboard Render -> New -> Blueprint -> seleziona il repo.
services:
  - type: web
    name: todo-app-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Render genera una stringa casuale: il server non parte senza (vedi server/src/config.js).
      - key: JWT_SECRET
        generateValue: true
      # Da incollare nel form del Blueprint: non va mai committata.
      - key: MONGO_URI
        sync: false
      # URL del frontend usato nei link delle mail (reset password).
      - key: APP_URL
        value: https://todo-app-six-rho-53.vercel.app
      # Invio mail (opzionale): senza SMTP_HOST le mail non partono ma l'app funziona.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
